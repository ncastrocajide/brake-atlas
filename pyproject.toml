[project]
name = "brakeatlas"
version = "0.1.0"
description = "Field-wide F1 braking analysis: every driver, every braking zone, every track, compared on a common distance axis"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ncastrocajide" }]
dependencies = [
    # Canonical Lap, FastF1 loader and corner marks come from apex-trace,
    # pinned to a commit so this study never moves under an engine change.
    "apextrace @ git+https://github.com/ncastrocajide/apex-trace@0b20479542dcc93114bab92c4f34dd78ebf08dcb",
    "fastf1>=3.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brakeatlas"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear traps,
# UP outdated idioms for the targeted Python version.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
